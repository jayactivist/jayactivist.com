<style>
  :root{--paper:#fbe9d8;--ink:#3a0d12;--flame:#d2481c}
  @media (prefers-color-scheme: dark){:root{--paper:#1e0a10;--ink:#fbe3cb;--flame:#f06a35}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:600 1rem system-ui,-apple-system,sans-serif}
  a{color:var(--flame)}
</style>
</head>
<body>
<p>Taking you to the shows… <a href="/#shows">Tap here if it doesn't load.</a></p>
<script>
  // Log the bio-link visit in GoatCounter, then jump to the Shows section on the homepage.
  window.goatcounter = {no_onload: true};
  var go = function(){ location.replace('/#shows'); };
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter', 'https://jayactivist.goatcounter.com/count');
  s.onload = function(){
    try { window.goatcounter.count({path: '/shows', title: 'Shows link'}); } catch(e){}
    setTimeout(go, 250);
  };
  s.onerror = go;
  document.head.appendChild(s);
  setTimeout(go, 1500); // never leave anyone stuck here
</script>
</body>
